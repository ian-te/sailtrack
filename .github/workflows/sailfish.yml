name: Sailfish RPM

# Builds harbour-sailtrack for 64- and 32-bit ARM with the community Sailfish Platform SDK image
# (as ian-te/ianassistant does): its target is whichever Sailfish release the image ships.
# Every push and pull request builds and keeps the RPMs as a workflow artifact for a few days. A
# tag vX.Y.Z builds that version (the spec's Version is set from the tag) and publishes the RPMs as
# the GitHub Release vX.Y.Z. See "Releasing" in the README.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SDK_IMAGE: coderus/sailfishos-platform-sdk:latest

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hl]
    steps:
      - uses: actions/checkout@v4

      # A release tag sets the version. Any other build keeps the spec's and gets Release 0.git<sha>,
      # which sorts below the release's -1.
      - name: Work out the version
        run: |
          SPEC_VERSION=$(sed -n 's/^Version:[[:space:]]*//p' rpm/harbour-sailtrack.spec)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1
            fi
            VERSION=${GITHUB_REF_NAME#v}
            [ "$VERSION" = "$SPEC_VERSION" ] || \
              echo "::warning::Tag $GITHUB_REF_NAME doesn't match the spec's Version $SPEC_VERSION; building $VERSION"
            RPM_RELEASE=1
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            VERSION=$SPEC_VERSION
            RPM_RELEASE=0.git${GITHUB_SHA::7}
            echo "RELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RPM_RELEASE=$RPM_RELEASE" >> "$GITHUB_ENV"
          echo "Building $VERSION-$RPM_RELEASE"

      # The SDK image holds every Sailfish target and unpacks to more than the runner has free.
      - name: Make room for the SDK image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - name: Build the RPM
        run: |
          sed -i -e "s/^Version:.*/Version:    $VERSION/" -e "s/^Release:.*/Release:    $RPM_RELEASE/" rpm/harbour-sailtrack.spec
          mkdir -p out && chmod a+w out
          # Target names carry the release (SailfishOS-5.2.0.15-aarch64), so take the one the image has.
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            $SDK_IMAGE \
            bash -ec "target=\$(ls /srv/mer/targets | grep -E '^SailfishOS-[0-9.]+-${{ matrix.arch }}\$' | sort -V | tail -1) \
              && echo \"Building for \$target\" && echo \"\${target#SailfishOS-}\" | sed 's/-${{ matrix.arch }}//' > /out/release.txt \
              && mkdir \$HOME/app && cd /src && cp -r common daemon app systemd rpm sailtrack.pro \$HOME/app/ && cd \$HOME/app \
              && mb2 -t \$target build \
              && cp RPMS/*.rpm /out/"
          ls -l out

      - uses: actions/upload-artifact@v4
        if: env.RELEASE != 'true'
        continue-on-error: true
        with:
          name: harbour-sailtrack-${{ env.VERSION }}-${{ env.RPM_RELEASE }}-${{ matrix.arch }}
          retention-days: 3
          path: out/*.rpm

      # Both architectures add their RPM to one release; whichever job comes first creates it.
      - name: Publish to the release (tags only)
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SFOS_RELEASE=$(cat out/release.txt)
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sailtrack $VERSION" \
              --notes "Built from ${GITHUB_SHA::7} for Sailfish OS $SFOS_RELEASE and later: aarch64 for 64-bit installs, armv7hl for 32-bit ones. Install from SailfishOS:Chum, or by hand with \`devel-su rpm -Uvh harbour-sailtrack-*.rpm\` and then \`systemctl --user daemon-reload\` (see the README)." \
            || gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "v$VERSION" out/*.rpm --repo "$GITHUB_REPOSITORY" --clobber
